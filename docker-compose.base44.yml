name: techhaven

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: techhaven
      POSTGRES_PASSWORD: techhaven_local_dev
      POSTGRES_DB: techhaven
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techhaven -d techhaven']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot schema + seed. Runs before the API starts.
  migrate:
    image: node:22-alpine
    working_dir: /app
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://techhaven:techhaven_local_dev@db:5432/techhaven
    volumes:
      - ./api:/app
      # Own dependency volume: a shared one would let this container's `npm ci`
      # remove the modules the already-running API is importing.
      - migrate_node_modules:/app/node_modules
    command: ['sh', '-ec', 'npm ci --omit=dev --no-audit --no-fund && node db/migrate.js']

  api:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: '4000'
      DATABASE_URL: postgres://techhaven:techhaven_local_dev@db:5432/techhaven
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    ports:
      - '8000:4000'
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    command:
      ['sh', '-ec', 'npm ci --omit=dev --no-audit --no-fund && exec node --watch src/server.js']
    healthcheck:
      # 127.0.0.1 rather than localhost: node binds IPv4 and busybox wget would try ::1.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_PROXY_TARGET=http://api:4000
      # Bare entries: the platform's values pass through, and are simply unset elsewhere.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - '3000:5173'
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund && exec npm run dev']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  db_data:
  api_node_modules:
  migrate_node_modules:
  web_node_modules:
